# dev.zed.ZedDevel.yaml
#
# Local-only manifest for testing a Zed branch inside the Flatpak sandbox.
#
# Unlike dev.zed.Zed.yaml, this compiles Zed from a local git checkout instead
# of unpacking a release tarball, and it follows the layout of upstream's
# crates/zed/resources/flatpak/manifest-template.json -- /app/bin/zed (the CLI
# launcher), /app/libexec/zed-editor, and bundled libraries in /app/lib. That
# layout is what crates/cli's sandbox-escape code expects, so the escape paths
# behave the way upstream intends rather than the way this repository's Flathub
# packaging deliberately breaks them.
#
# This manifest is NOT suitable for Flathub: the build needs network access so
# that cargo can fetch crates.
app-id: dev.zed.ZedDevel
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: zed
finish-args:
  # Needed by flatpak-spawn, which is how Zed restarts itself on the host
  - --talk-name=org.freedesktop.Flatpak

  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=host

  - --env=ZED_UPDATE_EXPLANATION=Please use flatpak to update zed

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # cargo fetches from crates.io and the git dependencies during the build
  build-args:
    - --share=network
    # Without this, flatpak-builder starts every build with an empty target dir and crate
    # cache, so all ~1200 crates recompile. Editing the manifest or moving the branch still
    # forces one full build, but everything after that is incremental.
    - --filesystem=/var/home/rbrue/.cache/zed-flatpak
  env:
    CARGO_TARGET_DIR: /var/home/rbrue/.cache/zed-flatpak/target
    CARGO_HOME: /var/home/rbrue/.cache/zed-flatpak/cargo
    # The release profile defaults to thin LTO with codegen-units=1, which needs
    # far more memory and disk than this machine has. None of that affects the
    # behaviour under test, so trade it away.
    # One job. Two rustc processes plus an IDE running rust-analyzer is enough to
    # push a 16GB machine into the OOM killer, and the editor loses that fight.
    CARGO_BUILD_JOBS: '1'
    CARGO_PROFILE_RELEASE_LTO: 'false'
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    CARGO_PROFILE_RELEASE_DEBUG: 'false'
    # Compiled in by crates/release_channel. The `dev` channel in the checkout
    # skips the single-instance CLI socket, and that socket is exactly what the
    # "Restart on Host" hand-off has to contend with, so pin a real channel.
    ZED_RELEASE_CHANNEL: stable
    # `script/bundle-linux --flatpak` sets this, and building cargo directly skips it. Without it
    # `SystemSpecs` cannot report which kind of install this is.
    ZED_BUNDLE_TYPE: flatpak

modules:
  - name: zed
    buildsystem: simple
    build-commands:
      # Normally generated by script/generate-licenses, which needs cargo-about
      # and network access of its own. The file only backs the in-app license
      # viewer, so an empty one is enough to build and run.
      - touch assets/licenses.md

      # .cargo/bundle-config.toml is what script/bundle-linux uses; it sets the
      # $ORIGIN/../lib rpath that makes /app/libexec/zed-editor find /app/lib.
      - cargo --config .cargo/bundle-config.toml build --release --package zed --package cli

      - install -Dm755 ${CARGO_TARGET_DIR}/release/cli ${FLATPAK_DEST}/bin/zed
      - install -Dm755 ${CARGO_TARGET_DIR}/release/zed ${FLATPAK_DEST}/libexec/zed-editor

      # Bundle the libraries that the escaped process needs once it is running
      # on the host, using the same exclusions as script/bundle-linux so that
      # the host's GLib, zlib and ALSA are still the ones that get loaded.
      - |
        set -eu
        install -d "${FLATPAK_DEST}/lib"
        ldd ${CARGO_TARGET_DIR}/release/zed \
          | cut -d' ' -f3 \
          | grep -v '\<\(libc.so\|libgcc_s.so\|libm.so\|libpthread.so\|libdl.so\|libasound.so\)' \
          | grep -v '\<\(libglib-2.0.so\|libgobject-2.0.so\|libgio-2.0.so\|libgmodule-2.0.so\|libpcre.so\|libpcre2-8.so\|libmount.so\|libblkid.so\|libselinux.so\|libffi.so\|libresolv.so\|libz.so\)' \
          | xargs -r install -Dm755 -t "${FLATPAK_DEST}/lib"

      # Only the 512x512 icon: flatpak refuses to export anything larger, which
      # is why upstream's manifest-template.json installs just this one.
      - install -Dm644 crates/zed/resources/app-icon-dev.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png

      - |
        set -eu
        export APP_NAME="Zed Devel"
        export APP_CLI="zed"
        export APP_ICON="${FLATPAK_ID}"
        export APP_ARGS="%U"
        export DO_STARTUP_NOTIFY="false"
        install -d "${FLATPAK_DEST}/share/applications"
        envsubst < crates/zed/resources/zed.desktop.in \
          > "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"

    sources:
      - type: git
        path: /var/home/rbrue/repos/zed
        branch: flatpak-alt
